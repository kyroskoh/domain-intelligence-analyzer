services:
  frontend:
    # Use Node.js to test if the port is listening instead of HTTP health check
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('net').connect({host:'127.0.0.1',port:4000}).on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s