services:
  # Backend development overrides
  backend:
    build:
      target: dev
      no_cache: ${DOCKER_BUILD_NO_CACHE:-false}
      pull: ${DOCKER_BUILD_PULL:-false}
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=debug
    volumes:
      - ./apps/backend:/app
      - /app/node_modules
    command: ["npm", "run", "dev"]
    # Enable hot reloading
    stdin_open: true
    tty: true

  # Frontend development overrides  
  frontend:
    build:
      target: dev
      no_cache: ${DOCKER_BUILD_NO_CACHE:-false}
      pull: ${DOCKER_BUILD_PULL:-false}
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4001}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4001}}
    environment:
      - NODE_ENV=development
      # Browser on the host must reach the published backend port (not Docker DNS)
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4001}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4001}}
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
      - /app/.next
    command: ["npm", "run", "dev"]
    # Enable hot reloading
    stdin_open: true
    tty: true

  # Development tools container (optional)
  dev-tools:
    image: node:22-alpine
    container_name: domain-analyzer-dev-tools
    working_dir: /workspace
    volumes:
      - .:/workspace
      - /workspace/node_modules
    networks:
      - domain-analyzer-network
    profiles:
      - tools
    command: ["tail", "-f", "/dev/null"]