version: '3.8'

services:
  # Backend API Service
  backend:
    build: 
      context: ./apps/backend
      dockerfile: Dockerfile
      target: runner
    container_name: domain-analyzer-backend
    restart: unless-stopped
    ports:
      - "4001:4001"
    environment:
      - NODE_ENV=production
      - PORT=4001
      - LOG_LEVEL=info
      # Redis configuration (optional)
      - REDIS_URL=${REDIS_URL:-}
      - REDIS_HOST=${REDIS_HOST:-}
      - REDIS_PORT=${REDIS_PORT:-}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      # Rate limiting
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-900000}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-100}
      # Security
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:4000,http://frontend:4000}
      # API Keys (if needed for external services)
      - WHOIS_API_KEY=${WHOIS_API_KEY:-}
      - DNS_API_KEY=${DNS_API_KEY:-}
    networks:
      - domain-analyzer-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4001/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - backend-logs:/app/logs
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Frontend Next.js Service
  frontend:
    build: 
      context: ./apps/frontend
      dockerfile: Dockerfile
      target: runner
    container_name: domain-analyzer-frontend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:4001
      - PORT=4000
      - HOSTNAME=0.0.0.0
    networks:
      - domain-analyzer-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Optional Redis service for caching
  redis:
    image: redis:7-alpine
    container_name: domain-analyzer-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    networks:
      - domain-analyzer-network
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    # Only start if Redis is explicitly enabled
    profiles:
      - redis

  # Nginx reverse proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: domain-analyzer-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - domain-analyzer-network
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M
    # Only start if nginx profile is enabled
    profiles:
      - nginx

networks:
  domain-analyzer-network:
    driver: bridge
    name: domain-analyzer-network

volumes:
  backend-logs:
    name: domain-analyzer-backend-logs
  redis-data:
    name: domain-analyzer-redis-data