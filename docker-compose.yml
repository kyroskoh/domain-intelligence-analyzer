services:
  # Backend API Service
  backend:
    build: 
      context: ./apps/backend
      dockerfile: Dockerfile
      target: runner
      # Set DOCKER_BUILD_NO_CACHE=true (or ./deploy.sh -r) after lockfile/Dockerfile bumps
      no_cache: ${DOCKER_BUILD_NO_CACHE:-false}
      pull: ${DOCKER_BUILD_PULL:-false}
    container_name: domain-analyzer-backend
    restart: unless-stopped
    ports:
      - "4001:4001"
    environment:
      - NODE_ENV=production
      - PORT=4001
      - LOG_LEVEL=info
      # Redis (profile: redis or default) — memory fallback if Redis is not running
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_TTL_SECONDS=${REDIS_TTL_SECONDS:-3600}
      - SNAPSHOT_TTL_SECONDS=${SNAPSHOT_TTL_SECONDS:-2592000}
      - SHARE_TTL_SECONDS=${SHARE_TTL_SECONDS:-604800}
      # Rate limiting
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-900000}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS:-100}
      # Lookup timeouts (ms) — RDAP registries can be slow from some VPS networks
      - WHOIS_TIMEOUT_MS=${WHOIS_TIMEOUT_MS:-10000}
      - RDAP_TIMEOUT_MS=${RDAP_TIMEOUT_MS:-25000}
      - DNS_TIMEOUT_MS=${DNS_TIMEOUT_MS:-5000}
      # Security
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:4000,http://frontend:4000}
      # Shared with nginx — when set, /api/* requires API key (X-API-Key or Bearer) + nonce
      - API_KEY=${API_KEY:-}
      # API Keys (if needed for external services)
      - WHOIS_API_KEY=${WHOIS_API_KEY:-}
      - DNS_API_KEY=${DNS_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4001/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - backend-logs:/app/logs
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Frontend Next.js Service
  frontend:
    build: 
      context: ./apps/frontend
      dockerfile: Dockerfile
      target: runner
      # Set DOCKER_BUILD_NO_CACHE=true (or ./deploy.sh -r) after lockfile/Dockerfile bumps
      no_cache: ${DOCKER_BUILD_NO_CACHE:-false}
      pull: ${DOCKER_BUILD_PULL:-false}
      args:
        # Baked into the client bundle at build time (set by ./deploy.sh).
        # With nginx: https://domainpeek.xyz — without: http://<public-ip>:4001
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4001}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4001}}
    container_name: domain-analyzer-frontend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      # Client bundle uses build-args above; INTERNAL_API_URL is server-side only
      - INTERNAL_API_URL=http://backend:4001
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4001}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4001}}
      - PORT=4000
      - HOSTNAME=0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Redis cache — opt-in via profile: redis | default
  redis:
    image: redis:7-alpine
    container_name: domain-analyzer-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
        redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
      else
        redis-server --appendonly yes;
      fi'
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG; else redis-cli ping | grep -q PONG; fi"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    profiles:
      - redis
      - default

  # Nginx reverse proxy — opt-in via profile: nginx | default (Certbot + Cloudflare DNS-01)
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
      no_cache: ${DOCKER_BUILD_NO_CACHE:-false}
      pull: ${DOCKER_BUILD_PULL:-false}
    container_name: domain-analyzer-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-}
      - CERTBOT_EMAIL=${CERTBOT_EMAIL:-}
      - CERTBOT_DOMAINS=${CERTBOT_DOMAINS:-}
      - CERTBOT_STAGING=${CERTBOT_STAGING:-0}
      - CERTBOT_RENEW_INTERVAL_SECONDS=${CERTBOT_RENEW_INTERVAL_SECONDS:-43200}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      - API_KEY=${API_KEY:-}
    volumes:
      # Template — entrypoint envsubst writes /etc/nginx/nginx.conf with API_KEY
      - ./nginx.conf:/etc/nginx/nginx.conf.template:ro
      - ./ssl:/etc/nginx/ssl:rw
      - letsencrypt:/etc/letsencrypt
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    # Only start with nginx or default profile
    profiles:
      - nginx
      - default


volumes:
  backend-logs:
    name: domain-analyzer-backend-logs
  redis-data:
    name: domain-analyzer-redis-data
  letsencrypt:
    name: domain-analyzer-letsencrypt
